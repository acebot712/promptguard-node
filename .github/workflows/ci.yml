name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only token. Per-job escalation only where required.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          # Built-in dependency cache; setup-node hashes package-lock.json
          # and restores ~/.npm. ~3-5x faster install on warm cache.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Biome check (lint + format)
        run: npx biome check .

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  validate-api-contract:
    name: Validate API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fetched from the PUBLIC docs URL, with no token and no
      # `continue-on-error`. Both of those went together, and together they
      # made this gate incapable of failing.
      #
      # It used to pull the spec from the private monorepo's contents API,
      # which needs OPENAPI_SPEC_TOKEN. That secret has never been provisioned
      # on this repository. So the step exited 1, `continue-on-error: true`
      # swallowed it, the validation step below was skipped by
      # `if: outcome == 'success'`, and the job reported SUCCESS having
      # compared nothing. Confirmed against real runs: every recorded
      # `Validate API Contract` concluded success without once invoking the
      # validator.
      #
      # The same document is published unauthenticated at the URL below -- it
      # is what the `sync-from-api` workflow already fetches, and it was
      # verified byte-identical to the copy committed in the monorepo. So the
      # token bought nothing except the failure mode.
      #
      # `--fail` makes a non-2xx a real failure now that nothing swallows it,
      # and that is a DELIBERATE new way for this job to go red: CI now depends
      # on docs.promptguard.co being reachable. That is the point -- the
      # alternative is the state this replaces, where the gate could not fail
      # for any reason at all. `--retry 3` absorbs a transient CDN blip; a
      # sustained outage should stop us claiming the SDK matches a spec we
      # could not read. The `sync-from-api` workflow already takes the same
      # dependency on the same URL.
      - name: Download OpenAPI spec
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error \
            -o openapi-developer.json \
            "https://docs.promptguard.co/api-reference/openapi-developer.json"

      - name: Validate SDK types against spec
        run: npx ts-node tests/validate-openapi.ts openapi-developer.json

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package
        run: npm pack --dry-run

      # Packs the real tarball and verifies every exports entry resolves
      # under both require() and native ESM import() — guards against
      # ERR_PACKAGE_PATH_NOT_EXPORTED regressions in package.json exports.
      - name: Packaging smoke test (CJS + ESM)
        run: npm run test:pack
