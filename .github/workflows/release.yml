name: Release to npm

on:
  release:
    types: [published]
  workflow_dispatch:

# Default to read-only. id-token: write is escalated only on the
# publish job that actually needs npm provenance signing.
permissions:
  contents: read

# Only one publish to npm at a time -- never two concurrent publishes
# of the same version. Don't cancel in progress: a half-rolled-back
# publish is worse than two queued.
concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A CHANGELOG is only worth having if it is written when the release is
      # cut. This fails the release rather than letting a version ship with no
      # entry -- reconstructing them afterwards produces a list of tag subjects,
      # which is what every entry below 1.10.1 already is.
      - name: CHANGELOG has an entry for this version
        run: node scripts/check-changelog.mjs

      - name: Biome check (lint + format)
        run: npx biome check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    # Trusted Publishing via npm provenance needs id-token: write.
    # contents: read is for checkout.
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version exists on npm
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view promptguard-sdk@$VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Publish (Trusted Publishing)
        if: steps.check.outputs.exists == 'false'
        # No NODE_AUTH_TOKEN: npm trusted publishing exchanges the OIDC
        # id-token above for a one-run credential (npm >= 11.5.1, which Node
        # 24 ships). Confirmed before the token was removed: 2.4.1 was
        # published by "GitHub Actions" through the trusted publisher, with the
        # token still set and unused. A long-lived token was a standing
        # credential-theft risk.
        run: npm publish --access public --provenance

  # Tells Slack #releases this version is on npm (ADR-0038 in the platform
  # repo). Only after a real publish, never for a re-run that found the
  # version already there. It cannot fail the release: the job is
  # continue-on-error and post-release.sh exits 0 on every failure, with a
  # warning (an unset SLACK_RELEASES_WEBHOOK_URL included).
  announce:
    name: Announce in #releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: publish
    if: needs.publish.outputs.published == 'true'
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Workload Identity, to read the webhook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      # Secret Manager is the only store; GitHub holds no secrets. This repo
      # reads as itself (direct Workload Identity Federation, no service account).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      - name: Read secrets from Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            SLACK_RELEASES_WEBHOOK_URL:promptguard-production-472014/SLACK_RELEASES_WEBHOOK_URL
      - name: Post to #releases
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ steps.secrets.outputs.SLACK_RELEASES_WEBHOOK_URL }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          scripts/post-release.sh "Node SDK" "v${VERSION}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION} · https://www.npmjs.com/package/promptguard-sdk/v/${VERSION}"
