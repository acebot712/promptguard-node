name: Sync Types from API Spec

on:
  # Weekly check for spec drift. The OpenAPI spec is published publicly
  # at https://docs.promptguard.co/api-reference/openapi-developer.json
  # so we don't need a cross-repo dispatch from the monorepo (which
  # required a fine-grained PAT we never set up). Pull-based, no auth,
  # no token-rotation surface, runs on the public Actions tier.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

# Workflow-level: minimal. Job-level escalates to write where needed.
permissions:
  contents: read

# Only one sync at a time -- two parallel runs would race on the
# branch + PR creation.
concurrency:
  group: sync-types
  cancel-in-progress: false

jobs:
  # This job used to duplicate promptguard-python's sync-from-api.yml
  # near-verbatim (same fetch/generate/validate/diff/PR-create shape,
  # differing only in npm vs pip mechanics). It's now hosted once at
  # acebot712/promptguard-python/.github/workflows/_sync-from-api.yml and
  # called from both repos -- see that file for what actually runs.
  sync-types:
    permissions:
      contents: write
      pull-requests: write
    uses: acebot712/promptguard-python/.github/workflows/_sync-from-api.yml@main
    with:
      runtime: node
      install-command: npm ci
      generate-types-command: npx ts-node scripts/generate-types-from-spec.ts openapi-developer.json
      adopt-contract-command: npx ts-node scripts/sync-guard-contract.ts guard-contract.upstream.json
      validate-command: |
        npx tsc --noEmit
        npm test
      generated-types-path: src/generated/
      generated-types-file-label: src/generated/api-types.ts
      sibling-sdk-name: the Python SDK
